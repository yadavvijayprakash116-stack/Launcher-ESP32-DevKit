name: Build XPT2046 Touch Test

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Extract Touch Test ZIP
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "ZIP files in repository:"
          find . -type f -name "*.zip" -print

          ZIP=$(find . -type f -name "*.zip" \
            ! -path "./.git/*" \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          unzip -q "$ZIP" -d extracted

          echo "Extracted project:"
          find extracted -type f -name "platformio.ini" -print

      - name: Find Touch Test project
        run: |
          set -e

          PROJECT=$(find extracted -type f -name "platformio.ini" \
            | head -1 \
            | sed 's#/platformio.ini##')

          if [ -z "$PROJECT" ]; then
            echo "ERROR: platformio.ini not found"
            find extracted -maxdepth 4 -type f -print
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Using project:"
          echo "$PROJECT"

          test -f "$PROJECT/platformio.ini"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Check PlatformIO
        working-directory: ${{ env.PROJECT }}
        run: |
          pio --version
          pio project config
          pio run --list-targets || true

      - name: Build Touch Test
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e
          pio run -e esp32-devkit-ili9341-xpt2046

      - name: Show build files
        working-directory: ${{ env.PROJECT }}
        run: |
          echo "===== BIN FILES ====="
          find .pio/build/esp32-devkit-ili9341-xpt2046 \
            -maxdepth 1 \
            -type f \
            -name "*.bin" \
            -printf "%f\n" \
            | sort

      - name: Create factory BIN
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          BUILD=".pio/build/esp32-devkit-ili9341-xpt2046"

          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.bin"

          python -m esptool merge-bin \
            -o "$BUILD/Firmware.factory.bin" \
            --flash-mode dio \
            --flash-freq 40m \
            --flash-size 4MB \
            0x1000 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0x10000 "$BUILD/firmware.bin"

          echo "===== FACTORY BIN ====="
          ls -lh "$BUILD/Firmware.factory.bin"

      - name: Upload Touch Test BIN
        uses: actions/upload-artifact@v4
        with:
          name: XPT2046-Touch-Test-BIN
          path: |
            ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/Firmware.factory.bin
            ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/firmware.bin
            ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/bootloader.bin
            ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/partitions.bin
          if-no-files-found: error
