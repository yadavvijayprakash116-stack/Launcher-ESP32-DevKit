name: Build ESP32 Launcher

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Launcher ZIP
        run: |
          unzip -q *.zip -d extracted
          find extracted -maxdepth 2 -type f | head -50

      - name: Find project
        run: |
          PROJECT=$(find extracted -name platformio.ini -type f | head -1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          echo "Project found at: $PROJECT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Launcher
        working-directory: ${{ env.PROJECT }}
        run: pio run -e esp32-devkit-ili9341-xpt2046

      - name: Upload BIN
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-Launcher-BIN
          path: ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/*.bin
