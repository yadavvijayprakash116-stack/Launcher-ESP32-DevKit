name: Build ESP32 Launcher

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Repository download
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Launcher ZIP extract
      - name: Extract Launcher ZIP
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Launcher ZIP not found"
            ls -lah
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          unzip -q "$ZIP" -d extracted

          echo "ZIP extracted successfully"

      # 3. Find the actual Launcher project
      - name: Find Launcher project
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            -path "*/support_files/custom_4Mb.csv" \
            -print -quit | \
            sed 's#/support_files/custom_4Mb.csv##')

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Launcher project not found"

            echo "platformio.ini files:"
            find extracted -name platformio.ini -print

            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Launcher project:"
          echo "$PROJECT"

          test -f "$PROJECT/platformio.ini"
          test -d "$PROJECT/boards/esp32-devkit-ili9341-xpt2046"

          echo "Launcher project structure OK"

      # 4. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 5. Install PlatformIO
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

          pio --version

      # 6. Fix the incompatible check_submodules script
      - name: Fix build scripts
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          echo "Removing incompatible check_submodules extra script..."

          sed -i \
            '/^[[:space:]]*pre:support_files\/check_submodules.py[[:space:]]*$/d' \
            platformio.ini

          echo "Checking remaining extra scripts..."

          grep -A10 '^extra_scripts' platformio.ini || true

          echo "Build-script fix completed."

      # 7. Confirm our target exists
      - name: Check PlatformIO environment
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          echo "Checking ESP32 DevKit environment..."

          grep -n \
            'esp32-devkit-ili9341-xpt2046' \
            platformio.ini \
            boards/esp32-devkit-ili9341-xpt2046/platformio.ini

          echo ""
          echo "PlatformIO configuration:"
          pio project config

      # 8. Build
      - name: Build ESP32 Launcher
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          echo "======================================"
          echo " BUILDING ESP32 LAUNCHER"
          echo "======================================"

          pio run -e esp32-devkit-ili9341-xpt2046

      # 9. Show generated files
      - name: Show build files
        working-directory: ${{ env.PROJECT }}
        run: |
          echo "======================================"
          echo " BUILD OUTPUT"
          echo "======================================"

          find .pio/build/esp32-devkit-ili9341-xpt2046 \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" | sort

      # 10. Upload complete firmware files
      - name: Upload ESP32 Launcher BIN
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-Launcher-DevKit-ILI9341-XPT2046
          path: |
            ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/*.bin
          if-no-files-found: error
