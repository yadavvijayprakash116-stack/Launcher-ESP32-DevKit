name: Build XPT2046 Touch Test

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Touch Test ZIP
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          ZIP=$(find . -maxdepth 1 -type f \
            -name 'XPT2046-Touch-Test-ESP32-DevKit-ILI9341-SAME-WIRING.zip' \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Touch Test ZIP not found"
            echo "ZIP files in repository:"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          unzip -q "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | sort

      - name: Find Touch Test project
        run: |
          set -e

          PROJECT=$(find extracted -type f -name 'platformio.ini' \
            | head -1 \
            | sed 's#/platformio.ini##')

          if [ -z "$PROJECT" ]; then
            echo "ERROR: platformio.ini not found"
            find extracted -name 'platformio.ini' -print
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Touch Test project:"
          echo "$PROJECT"

          test -f "$PROJECT/platformio.ini"
          test -f "$PROJECT/src/main.cpp"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Check PlatformIO environment
        working-directory: ${{ env.PROJECT }}
        run: |
          pio project config
          pio run --list-targets || true

      - name: Build Touch Test
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e
          pio run -e esp32-devkit-ili9341-xpt2046

      - name: Show build files
        working-directory: ${{ env.PROJECT }}
        run: |
          echo "Build output:"
          find .pio/build/esp32-devkit-ili9341-xpt2046 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      - name: Create factory BIN
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          BUILD_DIR=".pio/build/esp32-devkit-ili9341-xpt2046"

          test -f "$BUILD_DIR/bootloader.bin"
          test -f "$BUILD_DIR/partitions.bin"
          test -f "$BUILD_DIR/firmware.bin"

          python -m esptool version

          python -m esptool merge-bin \
            -o "$BUILD_DIR/Firmware.factory.bin" \
            --flash-mode dio \
            --flash-freq 40m \
            --flash-size 4MB \
            0x1000 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0x10000 "$BUILD_DIR/firmware.bin"

          ls -lh "$BUILD_DIR"/*.bin

      - name: Upload Touch Test BIN
        uses: actions/upload-artifact@v4
        with:
          name: XPT2046-Touch-Test-BIN
          path: |
            ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/Firmware.factory.bin
            ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/firmware.bin
            ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/bootloader.bin
            ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/partitions.bin
          if-no-files-found: error
