name: Build XPT2046 Touch Test

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. ZIP खोजकर extract करना
      - name: Find and Extract Touch Test ZIP
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "===== ZIP FILES ====="
          find . -type f -name "*.zip" \
            ! -path "./.git/*" \
            -print

          ZIP=$(find . -type f -name "*.zip" \
            ! -path "./.git/*" \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP"

          unzip -q "$ZIP" -d extracted

          echo "===== PLATFORMIO PROJECTS ====="
          find extracted -type f -name "platformio.ini" -print


      # 3. PlatformIO project ढूँढना
      - name: Find Touch Test project
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            -name "platformio.ini" \
            | head -1 \
            | sed 's#/platformio.ini##')

          if [ -z "$PROJECT" ]; then
            echo "ERROR: platformio.ini not found"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "===== PROJECT ====="
          echo "$PROJECT"

          test -f "$PROJECT/platformio.ini"


      # 4. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 5. PlatformIO + esptool
      - name: Install PlatformIO and esptool
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install platformio esptool

          echo "===== PLATFORMIO ====="
          pio --version

          echo "===== ESPTOOL ====="
          python -m esptool version


      # 6. PlatformIO environment check
      - name: Check PlatformIO
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          echo "===== PLATFORMIO CONFIG ====="
          pio project config

          echo "===== TARGETS ====="
          pio run --list-targets || true


      # 7. Build
      - name: Build Touch Test
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          pio run -e esp32-devkit-ili9341-xpt2046


      # 8. Build files दिखाना
      - name: Show build files
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          BUILD=".pio/build/esp32-devkit-ili9341-xpt2046"

          echo "===== ALL BUILD FILES ====="
          find "$BUILD" -maxdepth 1 -type f -printf "%f\n" | sort

          echo ""
          echo "===== BIN FILES ====="
          find "$BUILD" \
            -maxdepth 1 \
            -type f \
            -name "*.bin" \
            -printf "%f\n" \
            | sort


      # 9. Factory BIN बनाना
      - name: Create factory BIN
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          BUILD=".pio/build/esp32-devkit-ili9341-xpt2046"

          echo "Checking required files..."

          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.bin"

          echo "bootloader.bin     OK"
          echo "partitions.bin     OK"
          echo "firmware.bin       OK"

          echo ""
          echo "Creating Firmware.factory.bin..."

          python -m esptool merge-bin \
            -o "$BUILD/Firmware.factory.bin" \
            --flash-mode dio \
            --flash-freq 40m \
            --flash-size 4MB \
            0x1000 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0x10000 "$BUILD/firmware.bin"

          echo ""
          echo "===== FACTORY BIN CREATED ====="

          ls -lh "$BUILD/Firmware.factory.bin"


      # 10. BIN artifact upload
      - name: Upload Touch Test BIN
        uses: actions/upload-artifact@v4
        with:
          name: XPT2046-Touch-Test-BIN
          path: |
            ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/Firmware.factory.bin
            ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/firmware.bin
            ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/bootloader.bin
            ${{ env.PROJECT }}/.pio/build/esp32-devkit-ili9341-xpt2046/partitions.bin
          if-no-files-found: error
